name: Build site

# Rebuilds docs/index.html whenever anything that feeds the build changes,
# and commits the result back so the committed page is never out of date.
on:
  push:
    paths:
      - "src/**"
      - "data/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The coastline (about 13 MB) is downloaded once and reused across runs.
      - name: Cache Natural Earth coastline
        uses: actions/cache@v4
        with:
          path: .cache
          key: natural-earth-map-units-v1

      - name: Install dependencies
        run: npm ci

      - name: Validate data
        run: npm run check

      - name: Build
        run: npm run build

      - name: Commit rebuilt site
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "docs/index.html is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Rebuild docs/index.html [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
